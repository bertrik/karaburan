<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaburan navigation map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .status {
      background: rgba(255, 255, 255, .9);
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
      font: 14px/1.4 sans-serif;
      padding: 7px 10px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {zoomControl: true});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);

    const track = L.polyline([], {color: '#00a857', weight: 4}).addTo(map);
    const plan = L.polyline([], {color: '#087cff', weight: 4, dashArray: '8 6'}).addTo(map);
    const position = L.circleMarker([0, 0], {
      radius: 8, color: '#fff', weight: 2, fillColor: '#e23838', fillOpacity: 1
    });
    const status = L.control({position: 'topright'});
    status.onAdd = () => {
      status.element = L.DomUtil.create('div', 'status');
      status.element.textContent = 'Waiting for GPS...';
      return status.element;
    };
    status.addTo(map);
    let initialized = false;

    async function refresh() {
      try {
        const response = await fetch('/state', {cache: 'no-store'});
        const state = await response.json();
        if (!initialized) {
          map.setView(state.origin, 18);
          initialized = true;
        }
        track.setLatLngs(state.track);
        plan.setLatLngs(state.plan);
        if (state.position) {
          position.setLatLng(state.position).addTo(map);
          status.element.textContent =
            `GPS ${state.position[0].toFixed(6)}, ${state.position[1].toFixed(6)}`;
        }
      } catch (error) {
        status.element.textContent = 'ROS map connection unavailable';
      }
    }

    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
