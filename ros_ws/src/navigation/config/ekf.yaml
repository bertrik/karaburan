/ekf_filter_node:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 5.0
    initial_state_timeout: 10.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_covariance: [
      0.02, 0.0,    0.0,
      0.0,    0.02, 0.0,
      0.0,    0.0,    0.02
    ]
    imu0_queue_size: 10

    odom0: /odometry/gps
    odom0_config: [true,   true,   false,
                false, false, false,
                false, false, false,
                false, false, false,
                false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
