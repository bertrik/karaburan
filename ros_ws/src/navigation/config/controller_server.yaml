/controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/odometry/filtered"
    controller_plugins: ["FollowPath"]
    controller_frequency: 10.0
    transform_tolerance: 0.1
    failure_tolerance: 2.0
    costmap_update_timeout: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    current_goal_checker: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      # A displacement boat reacts more slowly than a wheeled robot. Looking
      # two metres ahead avoids chasing every nearby path sample and weaving.
      lookahead_dist: 2.0
      min_lookahead_dist: 1.0
      max_lookahead_dist: 3.0
      use_velocity_scaled_lookahead_dist: false
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.5
      use_rotate_to_heading: false
      allow_reversing: true
      # The collision monitor is the single safety authority. A second,
      # longer arc projection here used to veto otherwise safe moving turns.
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.1
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      stateful: true

/local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      transform_tolerance: 0.5
      # Rectangular hull (0.50 x 0.25 m) plus a small physical margin. A
      # circular 0.60 m footprint prevented safe close-quarters manoeuvres.
      footprint: "[[0.28, 0.15], [0.28, -0.15], [-0.28, -0.15], [-0.28, 0.15]]"
      footprint_padding: 0.02

      always_send_full_costmap: true
      static_layer:
        enabled: false

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.1
          obstacle_max_range: 8.0
          raytrace_min_range: 0.1
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Only measured obstacle cells are lethal. Surrounding water receives
        # a graded preference cost, so it remains usable for manoeuvring.
        inflation_radius: 1.5
        cost_scaling_factor: 1.5
