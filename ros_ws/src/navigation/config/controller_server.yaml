/controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/odometry/filtered"
    controller_plugins: ["FollowPath"]
    controller_frequency: 10.0
    transform_tolerance: 0.1
    failure_tolerance: 2.0
    costmap_update_timeout: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.1
      movement_time_allowance: 20.0

    current_goal_checker: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_dist: 1.5
      desired_linear_vel: 0.25
      transform_tolerance: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 3.0
      use_velocity_scaled_lookahead_dist: true
      max_robot_pose_search_dist: 10.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_cost_regulated_linear_velocity_scaling: true
      min_x_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001

/local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      transform_tolerance: 0.5
      robot_radius: 0.6
      cost_scaling_factor: 10.0

      always_send_full_costmap: true
      static_layer:
        enabled: false

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.1
          obstacle_max_range: 8.0
          raytrace_min_range: 0.1
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 10.0
